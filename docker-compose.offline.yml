# Offline distribution compose file — used after `docker load` from one of
# the autosys-clone-<arch>.tar.gz files. No source tree or registry needed.
# Same 3-container layout as docker-compose.yml/.dist.yml; see
# docker-compose.yml's header for the other ways to run this project.
#
#   docker load -i autosys-clone-<arch>.tar.gz
#   docker tag autosys-clone:<arch>     autosys-clone:latest
#   docker tag autosys-clone-web:<arch> autosys-clone-web:latest
#   docker compose -f docker-compose.offline.yml up -d
#
# Then open http://localhost:8080  (login: admin / admin)
#
# api/wcc now talk to the postgres service below rather than SQLite. This
# needs psycopg2/asyncpg inside the image (Dockerfile installs the [pg]
# extra) -- a tarball built before that change won't have it; rebuild and
# re-`docker save` before distributing.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AUTOSYS_DB_USER:-autosys}
      POSTGRES_PASSWORD: ${AUTOSYS_DB_PASSWORD:-autosys}
      POSTGRES_DB: ${AUTOSYS_DB_NAME:-autosys}
    volumes:
      - autosys-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTOSYS_DB_USER:-autosys}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: autosys-clone:latest
    command: ["autosys", "scheduler", "serve", "--host", "0.0.0.0", "--port", "9000", "--dry-run"]
    ports:
      - "9000:9000"
    volumes:
      - autosys-data:/app/data
    environment:
      AUTOSYS_DB_URL: postgresql://${AUTOSYS_DB_USER:-autosys}:${AUTOSYS_DB_PASSWORD:-autosys}@postgres:5432/${AUTOSYS_DB_NAME:-autosys}
      AUTOSYS_JWT_SECRET: ${AUTOSYS_JWT_SECRET:-dev-secret-change-in-production}
      AUTOSYS_AUTH_ENABLED: ${AUTOSYS_AUTH_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  wcc:
    image: autosys-clone:latest
    command: ["autosys", "scheduler", "wcc", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - autosys-data:/app/data
    environment:
      AUTOSYS_DB_URL: postgresql://${AUTOSYS_DB_USER:-autosys}:${AUTOSYS_DB_PASSWORD:-autosys}@postgres:5432/${AUTOSYS_DB_NAME:-autosys}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  web:
    image: autosys-clone-web:latest
    ports:
      - "8080:80"
    depends_on:
      - api
      - wcc
    restart: unless-stopped

volumes:
  autosys-data:
  autosys-pgdata:
