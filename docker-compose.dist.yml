# Distribution compose file — no source tree required. Same 3-container
# layout as docker-compose.yml, pulling prebuilt images from GHCR instead
# of building locally. See docker-compose.yml's header for the other ways
# to run this project (the single all-in-one container via plain `docker run`).
#
#   Put real values in a .env file next to this compose file first --
#   AUTOSYS_JWT_SECRET and the AUTOSYS_OIDC_*/AUTOSYS_PUBLIC_URL settings --
#   see .env.example. The api container refuses to start without them.
#
#   docker compose -f docker-compose.dist.yml pull
#   docker compose -f docker-compose.dist.yml up -d
#
# Then open http://localhost:8080 and sign in through Cognito.
#
# api/wcc now talk to the postgres service below rather than SQLite. This
# needs psycopg2/asyncpg inside the image (Dockerfile installs the [pg]
# extra) -- an image published before that change won't have it; rebuild
# and push a new tag before relying on this file.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AUTOSYS_DB_USER:-autosys}
      POSTGRES_PASSWORD: ${AUTOSYS_DB_PASSWORD:-autosys}
      POSTGRES_DB: ${AUTOSYS_DB_NAME:-autosys}
    volumes:
      - autosys-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTOSYS_DB_USER:-autosys}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/raghav-quest1/autosys-clone:latest
    command: ["autosys", "scheduler", "serve", "--host", "0.0.0.0", "--port", "9000", "--dry-run"]
    ports:
      - "9000:9000"
    volumes:
      - autosys-data:/app/data
    environment:
      AUTOSYS_DB_URL: postgresql://${AUTOSYS_DB_USER:-autosys}:${AUTOSYS_DB_PASSWORD:-autosys}@postgres:5432/${AUTOSYS_DB_NAME:-autosys}
      # No working default for the secret -- `autosys scheduler serve`
      # (startup_check_errors() in app_server/auth.py) refuses to start
      # without a real one, plus every AUTOSYS_OIDC_*/AUTOSYS_PUBLIC_URL
      # setting below: this server verifies sign-ins against Cognito, not a
      # local account list. The JWT secret default below must stay exactly
      # in sync with auth.py's _INSECURE_DEFAULT_SECRET constant -- that's
      # the literal string the startup check rejects; any other placeholder
      # string would silently pass as "real".
      AUTOSYS_JWT_SECRET: ${AUTOSYS_JWT_SECRET:-dev-secret-change-in-production}
      AUTOSYS_AUTH_ENABLED: ${AUTOSYS_AUTH_ENABLED:-true}
      AUTOSYS_OIDC_REGION: ${AUTOSYS_OIDC_REGION:-}
      AUTOSYS_OIDC_USER_POOL_ID: ${AUTOSYS_OIDC_USER_POOL_ID:-}
      AUTOSYS_OIDC_DOMAIN: ${AUTOSYS_OIDC_DOMAIN:-}
      AUTOSYS_OIDC_CLIENT_ID: ${AUTOSYS_OIDC_CLIENT_ID:-}
      AUTOSYS_PUBLIC_URL: ${AUTOSYS_PUBLIC_URL:-http://localhost:8080}
      AUTOSYS_M2M_CLIENT_IDS: ${AUTOSYS_M2M_CLIENT_IDS:-}
      AUTOSYS_M2M_SCOPE: ${AUTOSYS_M2M_SCOPE:-autosys-simulator/read}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  wcc:
    image: ghcr.io/raghav-quest1/autosys-clone:latest
    command: ["autosys", "scheduler", "wcc", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - autosys-data:/app/data
    environment:
      AUTOSYS_DB_URL: postgresql://${AUTOSYS_DB_USER:-autosys}:${AUTOSYS_DB_PASSWORD:-autosys}@postgres:5432/${AUTOSYS_DB_NAME:-autosys}
      # Same secret as api's -- see docker-compose.yml's wcc service for why
      # this matters (401 on every /api/wcc/* and /api/sse/* call otherwise).
      AUTOSYS_JWT_SECRET: ${AUTOSYS_JWT_SECRET:-dev-secret-change-in-production}
      AUTOSYS_AUTH_ENABLED: ${AUTOSYS_AUTH_ENABLED:-true}
      # startup_check_errors() (auth.py) requires these set too -- see
      # docker-compose.yml's wcc service for why.
      AUTOSYS_OIDC_REGION: ${AUTOSYS_OIDC_REGION:-}
      AUTOSYS_OIDC_USER_POOL_ID: ${AUTOSYS_OIDC_USER_POOL_ID:-}
      AUTOSYS_OIDC_DOMAIN: ${AUTOSYS_OIDC_DOMAIN:-}
      AUTOSYS_OIDC_CLIENT_ID: ${AUTOSYS_OIDC_CLIENT_ID:-}
      AUTOSYS_PUBLIC_URL: ${AUTOSYS_PUBLIC_URL:-http://localhost:8080}
      AUTOSYS_M2M_CLIENT_IDS: ${AUTOSYS_M2M_CLIENT_IDS:-}
      AUTOSYS_M2M_SCOPE: ${AUTOSYS_M2M_SCOPE:-autosys-simulator/read}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  web:
    image: ghcr.io/raghav-quest1/autosys-clone-web:latest
    ports:
      - "8080:80"
    depends_on:
      - api
      - wcc
    restart: unless-stopped

volumes:
  autosys-data:
  autosys-pgdata:
