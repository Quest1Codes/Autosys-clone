# Weekly update PRs so patched versions arrive without anyone having to look.
# Security updates (a CVE with a fix) are opened immediately regardless.
version: 2
updates:
  - package-ecosystem: npm
    directory: /wcc-frontend
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/postgres
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
