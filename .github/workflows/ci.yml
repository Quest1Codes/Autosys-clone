name: autosys-clone - CI

# First CI workflow for this repo (task A5 -- there was none at all before
# this). Scoped deliberately narrow: test the Python package, scan source
# dependencies with OSV-Scanner (task A2, Vishy named it specifically), build
# both shipped images and scan them with Trivy (task A3/A6 -- OS/image-layer
# CVEs OSV doesn't cover at all). No deploy job yet; this repo doesn't have
# one to model against the way shinro's CI does.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package (dev extras)
        run: pip install --no-cache-dir -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q

  # SQLite (used by every other test) ignores VARCHAR lengths; PostgreSQL --
  # what the client bundle runs -- enforces them. Real JIL values overflowed
  # fixed-size columns there and jobs silently went missing, or a whole
  # single-file export was rolled back (simulator audit ING-01/ING-02), and
  # no SQLite test could see it. This job runs the PostgreSQL tests against a
  # real server, as a non-superuser that owns its database (as
  # docker-entrypoint.sh sets up the bundle).
  test_postgres:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTOSYS_TEST_PG_URL: postgresql://autosys:ci-only-password@localhost:5432/autosys
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Create the application role and database
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE autosys LOGIN PASSWORD 'ci-only-password'"
          psql -h localhost -U postgres -c "CREATE DATABASE autosys OWNER autosys"

      - name: Install package (dev + PostgreSQL extras)
        run: pip install --no-cache-dir -e ".[dev,pg]"

      - name: Run PostgreSQL tests
        # -rs lists skips; the grep fails the job if the tests were skipped
        # instead of run (e.g. the URL variable went missing).
        shell: bash
        run: |
          pytest tests/test_postgres_limits.py -q -rs | tee pg-tests.txt
          ! grep -q "skipped" pg-tests.txt

  osv_scan:
    name: OSV-Scanner (source dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@764c91816374ff2d8fc2095dab36eecd42d61638 # v1.9.2
        with:
          scan-args: |-
            --format=table
            --output=osv-report.txt
            --recursive
            .
        continue-on-error: true

      - name: Publish OSV-Scanner Report to Summary
        if: always()
        shell: bash
        run: |
          echo "### 🔎 OSV-Scanner: source dependencies" >> "$GITHUB_STEP_SUMMARY"
          if [[ -s "osv-report.txt" ]]; then
            echo "<details><summary>Click to view findings</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat "osv-report.txt" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ No known vulnerabilities found." >> "$GITHUB_STEP_SUMMARY"
          fi

  scan_images:
    name: Build & Scan Docker Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: autosys-clone
            target: runtime
          - name: autosys-clone-web
            target: nginx-runtime
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Image
        run: |
          docker build --target "${{ matrix.image.target }}" \
            -t "${{ matrix.image.name }}:ci" .

      # exit-code stays "0" (report, don't block) -- no agreed vulnerability
      # triage/SLA policy yet (task C3, not started). Same non-blocking
      # posture as shinro's own Trivy job; revisit once C3 lands.
      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: "${{ matrix.image.name }}:ci"
          format: "table"
          output: "trivy-report-${{ matrix.image.name }}.txt"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "MEDIUM,HIGH,CRITICAL"

      - name: Publish Trivy Scan Report to Summary
        if: always()
        shell: bash
        run: |
          echo "### 🛡️ Trivy Scan: ${{ matrix.image.name }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -s "trivy-report-${{ matrix.image.name }}.txt" ]]; then
            echo "<details><summary>Click to view vulnerabilities</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat "trivy-report-${{ matrix.image.name }}.txt" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ No vulnerabilities found." >> "$GITHUB_STEP_SUMMARY"
          fi
