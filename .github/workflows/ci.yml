name: autosys-clone - CI

# Tests, then a vulnerability gate: OSV-Scanner on source dependencies, Trivy on
# the filesystem (secrets + Dockerfile misconfigurations) and on every shipped
# image. HIGH/CRITICAL findings that have a fix available fail the build;
# MEDIUM and up are always listed in the job summary. Also runs daily, because
# new CVEs are published against dependencies that haven't changed.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package (dev extras)
        run: pip install --no-cache-dir -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q

  # SQLite (used by every other test) ignores VARCHAR lengths; PostgreSQL --
  # what the client bundle runs -- enforces them. Real JIL values overflowed
  # fixed-size columns there and jobs silently went missing, or a whole
  # single-file export was rolled back (simulator audit ING-01/ING-02), and
  # no SQLite test could see it. This job runs the PostgreSQL tests against a
  # real server, as a non-superuser that owns its database (as
  # docker-entrypoint.sh sets up the bundle).
  test_postgres:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTOSYS_TEST_PG_URL: postgresql://autosys:ci-only-password@localhost:5432/autosys
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Create the application role and database
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE autosys LOGIN PASSWORD 'ci-only-password'"
          psql -h localhost -U postgres -c "CREATE DATABASE autosys OWNER autosys"

      - name: Install package (dev + PostgreSQL extras)
        run: pip install --no-cache-dir -e ".[dev,pg]"

      - name: Run PostgreSQL tests
        # -rs lists skips; the grep fails the job if the tests were skipped
        # instead of run (e.g. the URL variable went missing).
        shell: bash
        run: |
          pytest tests/test_postgres_limits.py -q -rs | tee pg-tests.txt
          ! grep -q "skipped" pg-tests.txt

  osv_scan:
    name: OSV-Scanner (source dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@764c91816374ff2d8fc2095dab36eecd42d61638 # v1.9.2
        with:
          scan-args: |-
            --format=table
            --output=osv-report.txt
            --recursive
            .

      - name: Publish OSV-Scanner Report to Summary
        if: always()
        shell: bash
        run: |
          echo "### 🔎 OSV-Scanner: source dependencies" >> "$GITHUB_STEP_SUMMARY"
          if [[ -s "osv-report.txt" ]]; then
            echo "<details><summary>Click to view findings</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat "osv-report.txt" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ No known vulnerabilities found." >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    name: Frontend (type-check, build, npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wcc-frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: wcc-frontend/package-lock.json

      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: npm audit (fails on high or critical)
        run: npm audit --audit-level=high

  # Secrets and Dockerfile misconfigurations (e.g. running as root), plus the
  # lockfile again via Trivy's own database as a second opinion to OSV.
  fs_scan:
    name: Trivy (filesystem, secrets, Dockerfiles)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: wcc-frontend/node_modules,reports
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  scan_images:
    name: Build & Scan (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: autosys-clone
            context: .
            args: --target runtime
          - name: autosys-clone-web
            context: .
            args: --target nginx-runtime
          - name: autosys-postgres
            context: deploy/postgres
            args: ""
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # --pull: rebuild on the current base image so a patched base is picked
      # up rather than a cached, stale layer.
      - name: Build Image
        run: |
          docker build --pull ${{ matrix.image.args }} \
            -t "${{ matrix.image.name }}:ci" "${{ matrix.image.context }}"

      # Full picture, never blocks: everything MEDIUM and up, in the summary.
      - name: Trivy report (MEDIUM and above)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.image.name }}:ci"
          format: "table"
          output: "trivy-report-${{ matrix.image.name }}.txt"
          exit-code: "0"
          ignore-unfixed: true
          scanners: vuln
          severity: "MEDIUM,HIGH,CRITICAL"

      # The gate: a HIGH or CRITICAL with a fix available fails the build.
      # Unfixed ones are ignored here (nothing to upgrade to) but still show
      # up in the daily dashboard scan.
      - name: Trivy gate (HIGH/CRITICAL with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.image.name }}:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: "HIGH,CRITICAL"

      - name: Publish Trivy Scan Report to Summary
        if: always()
        shell: bash
        run: |
          echo "### 🛡️ Trivy Scan: ${{ matrix.image.name }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -s "trivy-report-${{ matrix.image.name }}.txt" ]]; then
            echo "<details><summary>Click to view vulnerabilities</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat "trivy-report-${{ matrix.image.name }}.txt" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ No vulnerabilities found." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The images are minimal (Alpine, non-root); a change that scans clean can
  # still fail to start. Run both and hit them the way a user would.
  smoke:
    name: Smoke test (images start and serve)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build images
        run: |
          docker build --target runtime -t autosys-clone:ci .
          docker build -t autosys-postgres:ci deploy/postgres

      - name: Bundle mode serves the UI and issues a login token
        shell: bash
        run: |
          docker run -d --name bundle -p 8080:8080 \
            -e AUTOSYS_JWT_SECRET="$(openssl rand -hex 32)" \
            -e AUTOSYS_USERS='{"admin":{"password":"ci-only-password","role":"admin"}}' \
            autosys-clone:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/ >/dev/null && break
            docker inspect -f '{{.State.Running}}' bundle | grep -q true || { docker logs bundle; exit 1; }
            sleep 2
          done
          curl -sf http://localhost:8080/ >/dev/null || { docker logs bundle; exit 1; }
          curl -sf -X POST http://localhost:8080/api/v1/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-only-password"}' | grep -q access_token
          test "$(docker exec bundle id -u)" = 1001

      - name: Postgres image is healthy and non-root
        shell: bash
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci-only-password autosys-postgres:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' pg)" = healthy ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' pg)" = healthy
          test "$(docker exec pg id -un)" = postgres
