server {
    listen 80;

    root  /usr/share/nginx/html;
    index index.html;

    # Mutating REST API + JWT auth + JIL import + live WebSocket feed.
    location /api/v1/ {
        proxy_pass http://api:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Read-only dashboard JSON (job grid, box graph, alarms, run output).
    location /api/wcc/ {
        proxy_pass http://wcc:8080;
        proxy_set_header Host $host;
    }

    # Server-Sent Events — must not be buffered or cached.
    location /api/sse/ {
        proxy_pass http://wcc:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    # React SPA — everything else falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
