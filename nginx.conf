# nginx.conf — the "web" service's config in the multi-container compose
# files (docker-compose.yml / .dist.yml / .offline.yml). Proxies to the
# `api`/`wcc` services by their Docker-network hostnames — NOT for the
# single-container bundle image, which uses nginx.bundled.conf instead
# (loopback hostnames, since everything runs in one container there).
# Only a genuine WebSocket upgrade is forwarded to the upstream (static-
# analysis finding SEC-08). Passing $http_upgrade through unconditionally
# with `Connection: upgrade` also lets a client request `Upgrade: h2c`,
# which some backends honour -- tunnelling HTTP/2 past nginx's location
# rules (h2c request smuggling). Anything but "websocket" now gets no
# Upgrade header and an ordinary keep-alive connection.
map $http_upgrade $ws_upgrade {
    "~*^websocket$" $http_upgrade;
    default         "";
}
map $http_upgrade $ws_connection {
    "~*^websocket$" "upgrade";
    default         "";
}

server {
    listen 80;

    root  /usr/share/nginx/html;
    index index.html;

    # nginx's compiled-in default (1m) silently 413s any JIL file bigger than
    # that -- trivial to hit with a real box of a few hundred jobs -- before
    # the request even reaches the API. A real migration file can run into
    # the tens of MB, so this is generous on purpose.
    client_max_body_size 200m;

    # Mutating REST API + JWT auth + JIL import + live WebSocket feed.
    location /api/v1/ {
        proxy_pass http://api:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $ws_upgrade;
        proxy_set_header Connection        $ws_connection;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Read-only dashboard JSON (job grid, box graph, alarms, run output).
    location /api/wcc/ {
        proxy_pass http://wcc:8080;
        proxy_set_header Host $host;
    }

    # Server-Sent Events — must not be buffered or cached.
    location /api/sse/ {
        proxy_pass http://wcc:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    # React SPA — everything else falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
