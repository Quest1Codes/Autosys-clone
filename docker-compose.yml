# Local-source compose file — builds all three images from this checkout.
# Three separate containers (api / wcc / web-nginx) talking over the Docker
# network; this is what `nginx.conf` (not `nginx.bundled.conf`) is for.
#
#   docker compose up -d --build
#
# Then open http://localhost:8080
#
# Other ways to run this project with Docker:
#   docker-compose.dist.yml     — same 3-container layout, pulls prebuilt
#                                  images from GHCR instead of building.
#   `docker run <image>` (no command, no compose file at all) — the single
#                                  all-in-one container built from the
#                                  `runtime` Dockerfile stage; see
#                                  docker-entrypoint.sh and nginx.bundled.conf.
#                                  That path still defaults to SQLite (no
#                                  separate DB container to run alongside a
#                                  one-line `docker run`); this compose file's
#                                  api/wcc point at the postgres service below.
#
# This file alone is fully standalone -- no external network required, works
# with no Shinro checkout anywhere nearby. To also join Shinro's `shinro`
# Docker network (so the two stacks can reach each other by container-
# network hostname), layer docker-compose.shinro.yml on top instead of
# editing this file:
#   docker compose -f docker-compose.yml -f docker-compose.shinro.yml up -d
# See that file for why this needs to be a separate, opt-in override rather
# than baked in here: naming an external network in a compose file, even on
# just one service, makes Compose require that network to exist before ANY
# service in the file can start -- there's no way to make it optional
# in-line. See docker-compose.shinro.yml for the actual join + full
# instructions; shinro/README-DEV.md has the canonical joint walkthrough.
services:
  postgres:
    build:
      context: deploy/postgres
    image: autosys-postgres:17
    environment:
      POSTGRES_USER: ${AUTOSYS_DB_USER:-autosys}
      POSTGRES_PASSWORD: ${AUTOSYS_DB_PASSWORD:-autosys}
      POSTGRES_DB: ${AUTOSYS_DB_NAME:-autosys}
    volumes:
      - autosys-pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTOSYS_DB_USER:-autosys}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    image: autosys-clone:latest
    command: ["autosys", "scheduler", "serve", "--host", "0.0.0.0", "--port", "9000", "--dry-run"]
    ports:
      - "9000:9000"
    volumes:
      - autosys-data:/app/data
    environment:
      AUTOSYS_DB_URL: postgresql://${AUTOSYS_DB_USER:-autosys}:${AUTOSYS_DB_PASSWORD:-autosys}@postgres:5432/${AUTOSYS_DB_NAME:-autosys}
      # No working default for the secret -- `autosys scheduler serve`
      # (startup_check_errors() in app_server/auth.py) refuses to start
      # without a real one, plus every AUTOSYS_OIDC_*/AUTOSYS_PUBLIC_URL
      # setting below: this server verifies sign-ins against Cognito, not a
      # local account list, so it has nothing to check anyone against
      # without them. The JWT secret default below must stay exactly in
      # sync with auth.py's _INSECURE_DEFAULT_SECRET constant -- that's the
      # literal string the startup check rejects; any other placeholder
      # string would silently pass as "real". Put real values in a `.env`
      # file next to this compose file; see .env.example.
      AUTOSYS_JWT_SECRET: ${AUTOSYS_JWT_SECRET:-dev-secret-change-in-production}
      AUTOSYS_AUTH_ENABLED: ${AUTOSYS_AUTH_ENABLED:-true}
      AUTOSYS_OIDC_REGION: ${AUTOSYS_OIDC_REGION:-}
      AUTOSYS_OIDC_USER_POOL_ID: ${AUTOSYS_OIDC_USER_POOL_ID:-}
      AUTOSYS_OIDC_DOMAIN: ${AUTOSYS_OIDC_DOMAIN:-}
      AUTOSYS_OIDC_CLIENT_ID: ${AUTOSYS_OIDC_CLIENT_ID:-}
      AUTOSYS_PUBLIC_URL: ${AUTOSYS_PUBLIC_URL:-http://localhost:8080}
      AUTOSYS_M2M_CLIENT_IDS: ${AUTOSYS_M2M_CLIENT_IDS:-}
      AUTOSYS_M2M_SCOPE: ${AUTOSYS_M2M_SCOPE:-autosys-simulator/read}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  wcc:
    build:
      context: .
      target: runtime
    image: autosys-clone:latest
    command: ["autosys", "scheduler", "wcc", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - autosys-data:/app/data
    environment:
      AUTOSYS_DB_URL: postgresql://${AUTOSYS_DB_USER:-autosys}:${AUTOSYS_DB_PASSWORD:-autosys}@postgres:5432/${AUTOSYS_DB_NAME:-autosys}
      # Must be the SAME secret as api's, below -- this service verifies the
      # exact session cookie api's OIDC callback mints, via the same
      # auth.py module (autosys/wcc/app.py's _REQUIRE_LOGIN). Left out
      # before, this service booted anyway (now it won't -- see
      # cli/scheduler_cmd.py's scheduler_wcc) with no secret configured at
      # all, so every real session failed verification here: every
      # /api/wcc/* and /api/sse/* call 401'd, which is what made the job
      # grid show "No jobs found" / DISCONNECTED regardless of how much JIL
      # or run history had actually been imported through api.
      AUTOSYS_JWT_SECRET: ${AUTOSYS_JWT_SECRET:-dev-secret-change-in-production}
      AUTOSYS_AUTH_ENABLED: ${AUTOSYS_AUTH_ENABLED:-true}
      # startup_check_errors() (auth.py) requires these set too -- even
      # though wcc never runs the OIDC login routes itself (those are api's
      # alone), it verifies the same Cognito-issued M2M bearer tokens
      # (region/pool/M2M settings) and needs AUTOSYS_PUBLIC_URL for the
      # same-origin check on cookie-authenticated requests. Duplicating
      # api's exact config here is simpler to reason about and costs
      # nothing -- both read the same values, so there is nothing to keep
      # in sync.
      AUTOSYS_OIDC_REGION: ${AUTOSYS_OIDC_REGION:-}
      AUTOSYS_OIDC_USER_POOL_ID: ${AUTOSYS_OIDC_USER_POOL_ID:-}
      AUTOSYS_OIDC_DOMAIN: ${AUTOSYS_OIDC_DOMAIN:-}
      AUTOSYS_OIDC_CLIENT_ID: ${AUTOSYS_OIDC_CLIENT_ID:-}
      AUTOSYS_PUBLIC_URL: ${AUTOSYS_PUBLIC_URL:-http://localhost:8080}
      AUTOSYS_M2M_CLIENT_IDS: ${AUTOSYS_M2M_CLIENT_IDS:-}
      AUTOSYS_M2M_SCOPE: ${AUTOSYS_M2M_SCOPE:-autosys-simulator/read}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      target: nginx-runtime
    image: autosys-clone-web:latest
    ports:
      - "8080:80"
    depends_on:
      - api
      - wcc
    restart: unless-stopped

volumes:
  autosys-data:
  # New volume for PostgreSQL 17: the old `autosys-pgdata` was written by
  # postgres:16-alpine and cannot be opened by this image (different major
  # version and collation). Left in place as a backup; restore from a dump.
  autosys-pgdata17:
