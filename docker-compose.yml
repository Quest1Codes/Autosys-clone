# Local-source compose file — builds all three images from this checkout.
# Three separate containers (api / wcc / web-nginx) talking over the Docker
# network; this is what `nginx.conf` (not `nginx.bundled.conf`) is for.
#
#   docker compose up -d --build
#
# Then open http://localhost:8080
#
# Other ways to run this project with Docker:
#   docker-compose.dist.yml     — same 3-container layout, pulls prebuilt
#                                  images from GHCR instead of building.
#   docker-compose.offline.yml  — same layout again, from `docker load`-ed
#                                  local images (no registry/source needed).
#   `docker run <image>` (no command, no compose file at all) — the single
#                                  all-in-one container built from the
#                                  `runtime` Dockerfile stage; see
#                                  docker-entrypoint.sh and nginx.bundled.conf.
#                                  That path still defaults to SQLite (no
#                                  separate DB container to run alongside a
#                                  one-line `docker run`); this compose file's
#                                  api/wcc point at the postgres service below.
#
# This file alone is fully standalone -- no external network required, works
# with no Shinro checkout anywhere nearby. To also join Shinro's `shinro`
# Docker network (so the two stacks can reach each other by container-
# network hostname), layer docker-compose.shinro.yml on top instead of
# editing this file:
#   docker compose -f docker-compose.yml -f docker-compose.shinro.yml up -d
# See that file for why this needs to be a separate, opt-in override rather
# than baked in here: naming an external network in a compose file, even on
# just one service, makes Compose require that network to exist before ANY
# service in the file can start -- there's no way to make it optional
# in-line. See docker-compose.shinro.yml for the actual join + full
# instructions; shinro/README-DEV.md has the canonical joint walkthrough.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AUTOSYS_DB_USER:-autosys}
      POSTGRES_PASSWORD: ${AUTOSYS_DB_PASSWORD:-autosys}
      POSTGRES_DB: ${AUTOSYS_DB_NAME:-autosys}
    volumes:
      - autosys-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTOSYS_DB_USER:-autosys}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    image: autosys-clone:latest
    command: ["autosys", "scheduler", "serve", "--host", "0.0.0.0", "--port", "9000", "--dry-run"]
    ports:
      - "9000:9000"
    volumes:
      - autosys-data:/app/data
    environment:
      AUTOSYS_DB_URL: postgresql://${AUTOSYS_DB_USER:-autosys}:${AUTOSYS_DB_PASSWORD:-autosys}@postgres:5432/${AUTOSYS_DB_NAME:-autosys}
      # No working default for either of these two -- `autosys scheduler serve`
      # (startup_check_errors() in app_server/auth.py) refuses to start
      # without a real secret and at least one user. The JWT secret default
      # below must stay exactly in sync with auth.py's _INSECURE_DEFAULT_SECRET
      # constant -- that's the literal string the startup check rejects; any
      # other placeholder string would silently pass as "real". AUTOSYS_USERS
      # has no default at all on purpose (not even an obviously-fake one):
      # startup_check_errors() only checks it's non-empty, not that it's
      # non-default, so a baked-in admin/admin-style map here would actually
      # boot successfully instead of being rejected. Put real values in a
      # `.env` file next to this compose file; see .env.example.
      AUTOSYS_JWT_SECRET: ${AUTOSYS_JWT_SECRET:-dev-secret-change-in-production}
      AUTOSYS_AUTH_ENABLED: ${AUTOSYS_AUTH_ENABLED:-true}
      AUTOSYS_USERS: ${AUTOSYS_USERS:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  wcc:
    build:
      context: .
      target: runtime
    image: autosys-clone:latest
    command: ["autosys", "scheduler", "wcc", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - autosys-data:/app/data
    environment:
      AUTOSYS_DB_URL: postgresql://${AUTOSYS_DB_USER:-autosys}:${AUTOSYS_DB_PASSWORD:-autosys}@postgres:5432/${AUTOSYS_DB_NAME:-autosys}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      target: nginx-runtime
    image: autosys-clone-web:latest
    ports:
      - "8080:80"
    depends_on:
      - api
      - wcc
    restart: unless-stopped

volumes:
  autosys-data:
  autosys-pgdata:
