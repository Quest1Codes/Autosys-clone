[build-system]
requires = ["setuptools >= 68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autosys", "autosys.*"]

[project]
name = "autosys-clone"
version = "0.1.0"
description = "A deep clone of CA Workload Automation AE (AutoSys) for learning its internals"
readme = "README.md"
requires-python = ">= 3.10"
dependencies = [
    # Data validation & serialisation
    # Pinned exactly to match shinro/apps/api's pin (A1: one CVE report for
    # the two packages Shinro and this simulator both ship, not two).
    "pydantic == 2.11.5",
    "pydantic-settings",

    # ORM & database
    # The [asyncio] extra pulls in greenlet, which SQLAlchemy >= 2.1 requires
    # at import time for sqlalchemy.ext.asyncio (this codebase uses both
    # sync_session and async_session) -- without it, any environment that
    # resolves 2.1+ crashes on startup with "ImportError: ... requires that
    # the Python 'greenlet' library is installed", even though nothing else
    # about the code changed. Pinned exactly rather than left as >= 2.0 to
    # match shinro/apps/api's own exact pin (A1: one CVE report for the two
    # packages Shinro and this simulator both ship, not two).
    "sqlalchemy[asyncio] == 2.0.41",
    "aiosqlite",           # async SQLite driver

    # Transitive-only, pinned explicitly to force a patched version -- found
    # via Trivy carrying a known CVE (fixed upstream at 1.2.1) despite never
    # being imported by this codebase directly.
    "msgpack >= 1.2.1",

    # Async runtime
    "anyio",

    # Web (used from Phase 6 onward – declared early so the venv is stable)
    "fastapi",
    "uvicorn[standard]",
    "httpx",               # async HTTP client (agent callbacks)
    "jinja2",              # WCC HTML templates (Phase 9)
    "python-multipart",    # form data (Phase 9)

    # CLI
    "click",
    "rich",
    "tabulate",

    # Logging
    "loguru",

    # Utilities
    "python-dateutil",     # calendar / time parsing helpers
    "croniter",            # cron-style schedule evaluation
]

[project.optional-dependencies]
dev = [
    "pytest >= 7.4",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "black",
]
pg = [
    "asyncpg",
    "psycopg2-binary",
]

[project.scripts]
autosys = "autosys.cli.main:autosys"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-s", "--tb=short", "--no-header"]
markers = [
    "postgresql: requires a real PostgreSQL instance (skipped if unavailable)",
]

[tool.ruff]
line-length = 100
