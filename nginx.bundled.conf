server {
    listen 8080;

    root  /usr/share/nginx/html;
    index index.html;

    # Mutating REST API + JWT auth + JIL import + live WebSocket feed.
    # Same-container loopback, not a Docker network hostname -- this config
    # is only for the single-image bundle (see docker-entrypoint.sh); the
    # separate nginx-runtime stage keeps nginx.conf, which proxies to the
    # api/wcc container names used by the multi-container compose files.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Read-only dashboard JSON (job grid, box graph, alarms, run output).
    # Bound to the WCC backend's internal-only port (see docker-entrypoint.sh).
    location /api/wcc/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }

    # Server-Sent Events — must not be buffered or cached.
    location /api/sse/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    # React SPA — everything else falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
