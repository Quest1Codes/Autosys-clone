# Only a genuine WebSocket upgrade is forwarded to the upstream (static-
# analysis finding SEC-08). Passing $http_upgrade through unconditionally
# with `Connection: upgrade` also lets a client request `Upgrade: h2c`,
# which some backends honour -- tunnelling HTTP/2 past nginx's location
# rules (h2c request smuggling). Anything but "websocket" now gets no
# Upgrade header and an ordinary keep-alive connection.
map $http_upgrade $ws_upgrade {
    "~*^websocket$" $http_upgrade;
    default         "";
}
map $http_upgrade $ws_connection {
    "~*^websocket$" "upgrade";
    default         "";
}

server {
    listen 8080;

    root  /usr/share/nginx/html;
    index index.html;

    # See nginx.conf's copy of this line for why: nginx's 1m default 413s
    # any real JIL file of moderate size before it reaches the API.
    client_max_body_size 200m;

    # One readiness probe for the whole container. Kubernetes allows a single
    # readiness probe per container, and this image runs nginx, the API and
    # PostgreSQL together (docker-entrypoint.sh) -- so the probe has to cover
    # all three. Proxying the API's own DB-checking readiness endpoint does
    # exactly that: a response here means nginx is serving, the API answered,
    # and the API could reach PostgreSQL. Must sit above `location /`, which
    # otherwise serves the WCC SPA for this path with a 200 and a probe that
    # can never fail. Unauthenticated on purpose: a probe carries no
    # credentials, and it discloses only up/not-up.
    location = /healthz {
        proxy_pass http://127.0.0.1:9000/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Mutating REST API + JWT auth + JIL import + live WebSocket feed.
    # Same-container loopback, not a Docker network hostname -- this config
    # is only for the single-image bundle (see docker-entrypoint.sh); the
    # separate nginx-runtime stage keeps nginx.conf, which proxies to the
    # api/wcc container names used by the multi-container compose files.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $ws_upgrade;
        proxy_set_header Connection        $ws_connection;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # JIL import is the long pole here and nginx's default read timeout
        # is 60s. A real estate exceeds that easily: importing 9,000 jobs
        # took over a minute and returned 504 while the import carried on
        # server-side and committed anyway, and 40,000 jobs returned the
        # same 504 having committed nothing. Identical response, opposite
        # outcome, no way for the caller to tell which -- which is worse
        # than a clean failure, because the obvious reaction is to retry an
        # import that already succeeded.
        #
        # The SSE location below already carries a 1h timeout for the same
        # reason; this block was simply missed. The matching Ingress
        # annotations are necessary but not sufficient: they govern the
        # cluster's front door, while this governs the one inside the pod,
        # and a request has to survive both.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Read-only dashboard JSON (job grid, box graph, alarms, run output).
    # Bound to the WCC backend's internal-only port (see docker-entrypoint.sh).
    location /api/wcc/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }

    # Server-Sent Events — must not be buffered or cached.
    location /api/sse/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    # React SPA — everything else falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
